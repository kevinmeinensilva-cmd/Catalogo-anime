<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Catálogo de Animes 2026</title>
</head>

<body>
    <main class="page-wrapper">
        <section class="adicionar-item">
            <h1>Adicionar novo anime</h1>
            <form id="itemForm">
                <input id="nome" type="text" placeholder="Nome do anime" required>
                <input id="descricao" type="text" placeholder="Descrição breve" required>
                <input id="imagem" type="url" placeholder="URL da imagem" required>
                <button type="submit">Adicionar</button>
                <p id="statusMessage" class="status-message"></p>
            </form>
        </section>
    </main>

    <script>
        async function adicionarItem(event) {
            event.preventDefault();
            const nome = document.getElementById('nome').value.trim();
            const descricao = document.getElementById('descricao').value.trim();
            const imagem = document.getElementById('imagem').value.trim();
            const statusMessage = document.getElementById('statusMessage');

            if (!nome || !descricao || !imagem) {
                statusMessage.textContent = 'Preencha todos os campos.';
                statusMessage.classList.add('error');
                return;
            }

            const response = await fetch('/itens', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, descricao, imagem })
            });

            if (response.ok) {
                statusMessage.textContent = 'Item adicionado com sucesso!';
                statusMessage.classList.remove('error');
                statusMessage.classList.add('success');
                document.getElementById('itemForm').reset();
            } else {
                statusMessage.textContent = 'Erro ao adicionar item. Verifique os dados.';
                statusMessage.classList.add('error');
            }
        }

        document.getElementById('itemForm').addEventListener('submit', adicionarItem);
    </script>
</body>

</html>
