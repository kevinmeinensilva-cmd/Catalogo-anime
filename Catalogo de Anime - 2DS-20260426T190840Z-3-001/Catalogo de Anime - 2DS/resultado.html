<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Resultado Final - Animes 2026</title>
</head>

<body>
    <div class="resultado-container">
        <h1 class="resultado-title">🎉 Resultado Final 🎉</h1>
        <div id="resultado-content">
            <p class="loading-text">Carregando resultados...</p>
        </div>
        <div class="botao">
            <a href="index.html"><button class="restart-btn">🔄 Jogar Novamente</button></a>
        </div>
    </div>

    <script>
        const correctAnswers = {
            q1: 'verdadeiro', // One Piece
            q2: 'falso',      // Naruto
            q3: 'verdadeiro', // Hell's Paradise
            q4: 'falso'       // Evangelion
        };

        // Verificar se todas as perguntas foram respondidas
        function checkAllAnswered() {
            for (let i = 1; i <= 4; i++) {
                if (!localStorage.getItem(`resposta_q${i}`)) {
                    return false;
                }
            }
            return true;
        }

        // Calcular acertos e erros
        function calculateResults() {
            let acertos = 0;
            let erros = 0;

            for (let i = 1; i <= 4; i++) {
                const userAnswer = localStorage.getItem(`resposta_q${i}`);
                const correctAnswer = correctAnswers[`q${i}`];

                if (userAnswer === correctAnswer) {
                    acertos++;
                } else {
                    erros++;
                }
            }

            return { acertos, erros };
        }

        // Exibir resultados
        function displayResults() {
            const content = document.getElementById('resultado-content');

            if (!checkAllAnswered()) {
                content.innerHTML = `
                    <div class="incomplete">
                        <h2>❌ Jogo Incompleto</h2>
                        <p>Você precisa responder todas as perguntas primeiro!</p>
                        <p>Voltar para o início e jogar novamente.</p>
                    </div>
                `;
                return;
            }

            const { acertos, erros } = calculateResults();

            let message = '';
            let emoji = '';

            if (acertos === 4) {
                message = 'Perfeito! Você é um mestre dos animes!';
                emoji = '🏆';
            } else if (acertos >= 2) {
                message = 'Bom trabalho! Você conhece bem os animes.';
                emoji = '👏';
            } else {
                message = 'Continue tentando! O conhecimento vem com a prática.';
                emoji = '📚';
            }

            content.innerHTML = `
                <div class="results">
                    <div class="score">
                        <div class="score-item correct">
                            <span class="score-number">${acertos}</span>
                            <span class="score-label">Acertos</span>
                        </div>
                        <div class="score-item wrong">
                            <span class="score-number">${erros}</span>
                            <span class="score-label">Erros</span>
                        </div>
                    </div>
                    <div class="message">
                        <h2>${emoji} ${message}</h2>
                        <p>Sua pontuação: ${acertos}/4</p>
                    </div>
                </div>
            `;
        }

        // Limpar localStorage ao reiniciar
        document.addEventListener('DOMContentLoaded', function() {
            displayResults();
        });

        // Função para salvar pontuação
        async function saveScore(playerName) {
            const { acertos, erros } = calculateResults();
            try {
                const response = await fetch('/save-score', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        playerName: playerName,
                        score: acertos,
                        totalQuestions: 4
                    })
                });
                const result = await response.json();
                alert(result.message);
            } catch (error) {
                console.error('Erro ao salvar pontuação:', error);
                alert('Erro ao salvar pontuação. Tente novamente.');
            }
        }

        // Adicionar botão de salvar pontuação
        function addSaveScoreButton() {
            const container = document.querySelector('.resultado-container');
            const saveButton = document.createElement('button');
            saveButton.textContent = '💾 Salvar Pontuação';
            saveButton.className = 'save-score-btn';
            saveButton.onclick = function() {
                const playerName = prompt('Digite seu nome (ou deixe em branco para Anônimo):');
                saveScore(playerName);
            };
            container.appendChild(saveButton);
        }

        // Modificar displayResults para adicionar botão
        function displayResults() {
            const content = document.getElementById('resultado-content');

            if (!checkAllAnswered()) {
                content.innerHTML = `
                    <div class="incomplete">
                        <h2>❌ Jogo Incompleto</h2>
                        <p>Você precisa responder todas as perguntas primeiro!</p>
                        <p>Voltar para o início e jogar novamente.</p>
                    </div>
                `;
                return;
            }

            const { acertos, erros } = calculateResults();

            let message = '';
            let emoji = '';

            if (acertos === 4) {
                message = 'Perfeito! Você é um mestre dos animes!';
                emoji = '🏆';
            } else if (acertos >= 2) {
                message = 'Bom trabalho! Você conhece bem os animes.';
                emoji = '👏';
            } else {
                message = 'Continue tentando! O conhecimento vem com a prática.';
                emoji = '📚';
            }

            content.innerHTML = `
                <div class="results">
                    <div class="score">
                        <div class="score-item correct">
                            <span class="score-number">${acertos}</span>
                            <span class="score-label">Acertos</span>
                        </div>
                        <div class="score-item wrong">
                            <span class="score-number">${erros}</span>
                            <span class="score-label">Erros</span>
                        </div>
                    </div>
                    <div class="message">
                        <h2>${emoji} ${message}</h2>
                        <p>Sua pontuação: ${acertos}/4</p>
                    </div>
                </div>
            `;

            // Adicionar botão de salvar após um pequeno delay
            setTimeout(addSaveScoreButton, 1000);
        }
    </script>
</body>

</html>
